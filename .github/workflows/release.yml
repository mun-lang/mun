name: release
on:
  push:
    branches:
      - main
      - release/*

env:
  RUSTFLAGS: -Dwarnings

jobs:
  artifacts:
    name: Artifacts
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: "ubuntu-latest"
            dir: linux-x86_64
            artifacts: "mun libmun_runtime.so"
            RUSTFLAGS: "-Dwarnings"
          - os: "windows-latest"
            dir: windows-x86_64
            artifacts: "mun.exe mun_runtime.dll mun_runtime.dll.lib"
            RUSTFLAGS: "-Dwarnings"
          - os: "macos-15-intel"
            dir: macos-x86_64
            artifacts: "mun libmun_runtime.dylib"
            RUSTFLAGS: "-Dwarnings -Clink-arg=-lclang_rt.osx"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          frozen: true

      - name: Cargo build
        env:
          RUSTFLAGS: ${{ matrix.config.RUSTFLAGS }}
        run: pixi run build-release

      - run: mkdir -p ${{ matrix.config.dir }}

      - name: Move artifacts
        env:
          ARTIFACTS: ${{ matrix.config.artifacts }}
          OUT_DIR: ${{ matrix.config.dir }}
        run: |
          import os
          artifacts = os.environ['ARTIFACTS'].split()
          for artifact in artifacts:
            src = "target/release/%s" % artifact
            dst = os.environ['OUT_DIR'] + "/" + artifact
            os.rename(src, dst)
        shell: python

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.dir }}
          path: ${{ matrix.config.dir }}
